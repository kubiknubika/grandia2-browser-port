<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandia II Battle Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #renderCanvas { width: 100vw; height: 100vh; touch-action: none; outline: none; display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .hud-header { padding: 20px; text-shadow: 1px 1px 2px #000; margin: 0; }

        /* Настройки (Settings) */
        #settings-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid #5a6e8c;
            border-radius: 8px;
            padding: 10px 15px;
            pointer-events: auto; /* Позволяет кликать */
            font-size: 14px;
        }

        #settings-panel label { cursor: pointer; display: flex; align-items: center; gap: 8px; }

        /* Party Cards */
        #party-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
        }

        .character-card {
            background: linear-gradient(135deg, rgba(20,30,45,0.9), rgba(10,15,25,0.9));
            border: 2px solid #5a6e8c;
            border-radius: 8px;
            width: 180px;
            padding: 10px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .char-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #5a6e8c; padding-bottom: 4px; color: #d1d8e0; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px; }
        .stat-label { color: #8da3c7; }
        .stat-value.hp { color: #2ecc71; font-weight: bold; }
        .stat-value.sp { color: #f1c40f; font-weight: bold; }
        .stat-value.mp { color: #3498db; font-weight: bold; }

        /* IP Gauge */
        #ip-gauge-container { 
            position: absolute; 
            bottom: 30px; 
            right: 30px; 
            width: 400px; 
            height: 40px; 
            background: rgba(0, 0, 0, 0.7); 
            border: 2px solid #557799; 
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="ui-layer">
        <h2 class="hud-header">Garmia Tower</h2>
        
        <div id="settings-panel">
            <label>
                <input type="checkbox" id="toggle-models">
                Load 3D Models (Requires GLB files)
            </label>
        </div>
        
        <div id="party-container"></div>
        <div id="ip-gauge-container"></div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
